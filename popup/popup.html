<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mark My Tabs</title>
  <script src="../common/theme.js"></script>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="searchBar">
    <span class="search-icn"></span>
    <input id="search" type="text" placeholder="Search your bookmarks…" data-i18n-placeholder="searchBookmarks" autocomplete="off" spellcheck="false" autofocus>
  </div>

  <div id="body">
    <div id="currentPage" hidden></div>
    <div id="results"></div>
  </div>

  <footer>
    <span id="total"></span>
    <span class="foot-actions">
      <button id="btnLang" class="lang-mini" type="button"></button>
      <button id="btnCollapse" class="icon-mini" title="Collapse folders" data-i18n-title="collapseFolders"></button>
      <button id="btnManager" class="btn-open"></button>
    </span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
