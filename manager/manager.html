<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark My Tabs</title>
  <script src="../common/theme.js"></script>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <div id="app">
    <div id="sidebarBackdrop" hidden></div>
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg>
        </span>
        <span class="brand-name">Mark My <b>Tabs</b></span>
      </div>

      <nav id="views" aria-label="Views" data-i18n-aria-label="views"></nav>

      <div class="tree-head">
        <span data-i18n="folders">Folders</span>
        <button id="btnTreeNewFolder" class="icon-btn sm" title="New folder" data-i18n-title="newFolder"></button>
      </div>
      <div id="tree" role="tree"></div>

      <footer id="stats"></footer>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="btnSidebar" class="icon-btn" title="Show folders" data-i18n-title="showFolders"></button>
        <div id="searchWrap">
          <span class="search-icn"></span>
          <input id="search" type="text" placeholder="Search your bookmarks…" data-i18n-placeholder="searchBookmarks" autocomplete="off" spellcheck="false">
          <button id="btnClearSearch" class="icon-btn sm" title="Clear (Esc)" data-i18n-title="clearSearch" hidden></button>
          <span class="kbd-hint"><kbd>Ctrl</kbd><kbd>K</kbd></span>
        </div>
        <div class="tools">
          <button id="btnSort" class="btn ghost" title="Sort" data-i18n-title="sort"></button>
          <button id="btnLayout" class="icon-btn" title="Cambiar vista"></button>
          <button id="btnTheme" class="icon-btn" title="Cambiar tema"></button>
          <button id="btnLang" class="lang-btn" type="button"></button>
          <button id="btnAdd" class="btn primary"></button>
        </div>
      </header>

      <div id="tipbar" hidden></div>

      <div id="contentHead">
        <div id="breadcrumb"></div>
        <div class="head-row">
          <h1 id="viewTitle"></h1>
          <span id="viewCount"></span>
          <div class="head-actions" id="headActions"></div>
        </div>
      </div>

      <section id="content" tabindex="-1"></section>

      <div id="bulkbar" hidden></div>
    </main>
  </div>

  <div id="ctxMenu" role="menu" hidden></div>
  <div id="modalRoot" hidden></div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="manager.js"></script>
</body>
</html>
